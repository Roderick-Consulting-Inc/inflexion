[project]
name = "inflexion"
version = "0.0.18"
description = "Inflexión: a Rioplatense-Spanish-grammar esoteric programming language interpreter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ramon Rodriguez", email = "ramon@roderickc.com" }]
dependencies = [
    "spacy>=3.7",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
inflexion = "inflexion.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
